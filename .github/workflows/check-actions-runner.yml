name: Check GitHub Actions Runner Version
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-version-update
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check upstream and open update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(awk '$1 == "actions-runner" {print $2}' .tool-versions)
          latest=$(gh api repos/actions/runner/releases/latest --jq '.tag_name')
          latest=${latest#v}
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$current" != "$latest" ]] || exit 0
          branch="update-actions-runner-$latest"
          existing=$(gh pr list --head "$branch" --state all --json number --jq 'length')
          [[ "$existing" == 0 ]] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          printf 'actions-runner %s\n' "$latest" > .tool-versions
          git add .tool-versions
          git commit -m "Update GitHub Actions Runner to version $latest"
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/pr.md" <<NOTES
          Update the runner base image from $current to $latest.

          Upstream release: https://github.com/actions/runner/releases/tag/v$latest
          After merge, the release and multi-platform image build run automatically.
          NOTES
          gh pr create --base main --head "$branch" --title "Update GitHub Actions Runner to version $latest" --body-file "$RUNNER_TEMP/pr.md"
