name: Validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        run: |
          version=$(awk '$1 == "actions-runner" {print $2}' .tool-versions)
          docker build --build-arg RUNNER_VERSION="$version" -t runner:test .
          bash scripts/test-image.sh runner:test
